<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101815">
  <meta name="description" content="在医院的三层楼和地下室之间探索。">
  <title>地狱无门</title>
  <link rel="stylesheet" href="style.css">
  <script src="hospital.js" defer></script>
  <script src="map.js" defer></script>
  <script src="lighting.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
    <main id="home" class="home" aria-labelledby="game-title">
      <div class="home-stage">
        <div class="home-frame" aria-hidden="true"></div>
        <div class="home-content">
          <header class="home-title"><h1 id="game-title">地狱无门</h1></header>
          <nav id="title-menu" class="title-menu" aria-label="主菜单">
            <button type="button" class="title-menu-entry" id="new-game" disabled>开始游戏</button>
            <button type="button" class="title-menu-entry" id="continue-game" disabled>继续游戏</button>
            <button type="button" class="title-menu-entry" id="load-game" disabled>读取存档</button>
            <button type="button" class="title-menu-entry" id="open-settings">游戏设置</button>
          </nav>
          <div id="asset-loading" class="asset-loading">
            <progress id="asset-progress" aria-label="素材加载进度"></progress>
            <p id="asset-status" role="status">正在加载游戏素材</p>
          </div>
          <button type="button" id="retry-assets" class="quiet" hidden>重新加载</button>
        </div>
        <footer class="title-footer" aria-hidden="true">↑ ↓ 选择 <span>·</span> Enter 确认</footer>
      </div>
      <dialog id="character-select" class="title-dialog" aria-labelledby="character-label">
        <div class="dialog-bar">
          <h2 id="character-label">选择主角</h2>
          <button type="button" class="quiet dialog-close" aria-label="关闭">×</button>
        </div>
        <div class="title-dialog-body">
          <div class="character-options">
            <button type="button" class="character-option" data-character="man" aria-pressed="false">
              <canvas width="272" height="256" aria-hidden="true"></canvas><span>男</span>
            </button>
            <button type="button" class="character-option" data-character="woman" aria-pressed="false">
              <canvas width="272" height="256" aria-hidden="true"></canvas><span>女</span>
            </button>
          </div>
          <p id="new-game-warning" hidden>进入医院后将覆盖当前自动存档。</p>
          <button type="button" id="enter-game" class="enter-game" disabled>进入医院</button>
        </div>
      </dialog>
      <dialog id="load-dialog" class="title-dialog" aria-labelledby="load-label">
        <div class="dialog-bar">
          <h2 id="load-label">读取存档</h2>
          <button type="button" class="quiet dialog-close" aria-label="关闭">×</button>
        </div>
        <div class="title-dialog-body">
          <button type="button" id="load-slot" class="title-menu-entry save-slot">自动存档 <span id="save-location"></span></button>
          <p id="no-save" hidden>暂无存档</p>
        </div>
      </dialog>
      <dialog id="settings-dialog" class="title-dialog" aria-labelledby="settings-label">
        <div class="dialog-bar">
          <h2 id="settings-label">游戏设置</h2>
          <button type="button" class="quiet dialog-close" aria-label="关闭">×</button>
        </div>
        <div class="title-dialog-body">
          <label class="volume-control">背景音乐 <input id="music-volume" type="range" min="0" max="100" value="47"><output id="volume-value">47%</output></label>
        </div>
      </dialog>
    </main>
    <main id="stage" class="stage" aria-label="地狱无门" hidden>
        <p id="controls" class="sr-only">单击地面步行，双击奔跑。WASD 或方向键移动，按住 Shift 奔跑，J 攻击，E 交互，T 开关手电，I 背包，B 背景音乐，M 地图，F 全屏。奔跑和攻击消耗体力。三楼黑暗中会失去理智，归零即死亡。</p>
        <span id="location" class="sr-only" role="status"></span>
        <span id="flashlight-status" class="sr-only" role="status"></span>
        <span id="music-status" class="sr-only" role="status"></span>
        <span id="combat-status" class="sr-only" role="status"></span>
        <div id="viewport" class="viewport" role="region" aria-label="游戏场景" aria-describedby="controls">
          <div id="world" class="world">
            <div id="backdrop" class="backdrop"></div>
            <div id="markers" class="markers"></div>
            <canvas id="lighting" class="lighting" aria-hidden="true" hidden></canvas>
            <div id="player" class="actor player" aria-hidden="true">
              <div class="shadow"></div>
              <canvas id="player-body" class="player-body" width="272" height="256"></canvas>
              <span class="attack-sweep"></span>
            </div>
          </div>
          <div class="vignette"></div>
          <button id="minimap" type="button" class="minimap" aria-label="展开医院地图" aria-haspopup="dialog">
            <span class="minimap-heading" id="map-position"></span>
            <canvas id="map-canvas" width="512" height="176" aria-hidden="true"></canvas>
          </button>
          <div class="status-hud" id="status-hud" aria-label="角色状态">
            <div class="status-orb">
              <div class="status-half sanity-half">
                <label class="sr-only" for="sanity">理智</label>
                <meter id="sanity" class="sr-only" min="0" max="100" value="100"></meter>
                <span class="status-liquid"></span><span class="status-number" id="sanity-number" aria-hidden="true">100</span>
              </div>
              <div class="status-half stamina-half">
                <label class="sr-only" for="stamina">体力</label>
                <meter id="stamina" class="sr-only" min="0" max="100" value="100"></meter>
                <span class="status-liquid"></span><span class="status-number" id="stamina-number" aria-hidden="true">100</span>
              </div>
            </div>
            <div class="status-labels" aria-hidden="true"><span>理智</span><span>体力</span></div>
          </div>
          <div class="flashlight-control">
            <button type="button" id="open-backpack" class="gear-button backpack-toggle" aria-label="打开背包" aria-keyshortcuts="I" aria-haspopup="dialog" aria-controls="backpack">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5V3h6v2M5 10H3v8h2m14-8h2v8h-2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M5 8l3-3h8l3 3v12l-2 1H7l-2-1z" fill="#665039" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M5 9h14M9 9v4h6V9m-7 6h8v3H8z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="flashlight-toggle" class="gear-button flashlight-toggle" aria-label="手电" aria-keyshortcuts="T" aria-pressed="false" aria-describedby="battery-level" data-powered="false">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.5 9h7l4-3h2v12h-2l-4-3h-7zM7 12h1.5"/>
                <path class="flashlight-rays" d="M19 12h3m-3-4 2.5-1.5M19 16l2.5 1.5"/>
              </svg>
            </button>
            <span id="battery-level" class="battery-level">0%</span>
            <span id="flashlight-hint" class="flashlight-hint" role="status"></span>
          </div>
        </div>
        <div class="touch-controls" aria-label="触屏操作">
          <div class="dpad">
            <button type="button" class="up" data-move="up" aria-label="向上">↑</button>
            <button type="button" class="left" data-move="left" aria-label="向左">←</button>
            <button type="button" class="down" data-move="down" aria-label="向下">↓</button>
            <button type="button" class="right" data-move="right" aria-label="向右">→</button>
          </div>
          <div class="touch-actions">
            <button type="button" data-move="sprint">奔跑</button>
            <button type="button" id="touch-attack">攻击</button>
            <button type="button" id="touch-interact">交互</button>
          </div>
        </div>
        <dialog id="map" aria-labelledby="map-title">
          <div class="dialog-bar">
            <span id="map-title">医院地图</span>
            <button type="button" id="close-map" class="quiet" aria-label="关闭地图">×</button>
          </div>
          <div class="floors" id="floors"></div>
          <p class="map-legend"><span>◆ 你的位置</span><span>■ 已到访</span><span>↑↓ 楼梯</span></p>
        </dialog>
        <dialog id="death-dialog" class="death-dialog" aria-labelledby="death-title">
          <h2 id="death-title">你已死亡</h2>
          <p>理智耗尽</p>
          <button type="button" class="title-menu-entry" id="restart-game">重新开始</button>
        </dialog>
        <dialog id="backpack" class="backpack" aria-labelledby="backpack-title">
          <div class="dialog-bar">
            <h2 id="backpack-title">背包</h2>
            <span id="backpack-capacity" class="backpack-capacity"></span>
            <button type="button" id="close-backpack" class="quiet dialog-close" aria-label="关闭背包">×</button>
          </div>
          <ol id="backpack-slots" class="backpack-slots" aria-label="物品栏"></ol>
          <div class="backpack-detail" id="backpack-detail" role="status"></div>
        </dialog>
    </main>
</body>
</html>
